services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: network_master
      MYSQL_USER: pid
      MYSQL_PASSWORD: pidpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: pid
      MONGO_INITDB_ROOT_PASSWORD: pidpassword
      MONGO_INITDB_DATABASE: network_telemetry
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: network_warehouse
      POSTGRES_USER: pid
      POSTGRES_PASSWORD: pidpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro

  dashboard:
    build: ./src/dashboard
    environment:
      POSTGRES_DSN: postgresql://pid:pidpassword@postgres:5432/network_warehouse
      MONGODB_URI: mongodb://pid:pidpassword@mongodb:27017/network_telemetry?authSource=admin
      MYSQL_HOST: mysql
      MYSQL_DATABASE: network_master
      MYSQL_USER: pid
      MYSQL_PASSWORD: pidpassword
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - mongodb
      - postgres
    volumes:
      - ./src/etl:/app/etl:ro

  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.8.1
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW_ADMIN_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.0.3 pymongo==4.6.1 psycopg2-binary==2.9.9"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src/etl:/opt/airflow/etl
    depends_on:
      - airflow-postgres
      - mongodb
      - postgres

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres

volumes:
  mysql_data:
  mongo_data:
  postgres_data:
  airflow_postgres_data:
  grafana_data:
