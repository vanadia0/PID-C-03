services:
  mqtt-kafka-bridge:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: ["python", "-c", "from src.ingest import run_bridge; run_bridge()"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: campus.telemetry
    depends_on:
      mqtt:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  spark-ingest:
    image: apache/spark:3.5.5
    command:
      - /bin/bash
      - -c
      - mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars /tmp/pymongo && pip install --no-cache-dir --target /tmp/pymongo pymongo==4.10.1 && IVY_HOME=/tmp/.ivy2 PYTHONPATH=/tmp/pymongo /opt/spark/bin/spark-submit --master local[1] --conf spark.jars.ivy=/tmp/.ivy2 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5 /app/src/streaming.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: campus.telemetry
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: network
    volumes:
      - ./src:/app/src:ro
    depends_on:
      - kafka
      - mongodb
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-1}
      FLASH_CROWD: ${FLASH_CROWD:-false}
      COUNTER_RESET_PROBABILITY: ${COUNTER_RESET_PROBABILITY:-0.01}
      INCONSISTENT_UNIT_PROBABILITY: ${INCONSISTENT_UNIT_PROBABILITY:-0.01}
      MISSING_HEARTBEAT_PROBABILITY: ${MISSING_HEARTBEAT_PROBABILITY:-0.001}
      INVENTORY_PATH: /app/config/campus.json
    volumes:
      - ./config/campus.json:/app/config/campus.json:ro
    depends_on:
      - mqtt
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0.16
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-network-local-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-network}
      MYSQL_USER: ${MYSQL_USER:-network}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-network-local-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  warehouse:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow-db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local-password}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow-local-password}@airflow-db:5432/${AIRFLOW_DB:-airflow}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.5
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    volumes:
      - spark_data:/opt/spark/work
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.5
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1G
    volumes:
      - spark_data:/opt/spark/work
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  airflow_db_data:
  airflow_logs:
  grafana_data:
  kafka_data:
  mongodb_data:
  mosquitto_data:
  mysql_data:
  spark_data:
  warehouse_data:
